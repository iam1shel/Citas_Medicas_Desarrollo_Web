<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Reporte de Citas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5">
    <div class="card shadow">
        <div class="card-header bg-dark text-white">
            <h3 class="mb-0">Reporte Agrupado de Citas</h3>
        </div>
        <div class="card-body">

            <form action="/vistas/consultas/reporte" method="get" class="row g-3">
                <div class="col-md-5">
                    <label class="form-label fw-bold">Nombre del Médico:</label>
                    <input type="text" name="medico" class="form-control" placeholder="Ej. Carlos" required>
                </div>
                <div class="col-md-5">
                    <label class="form-label fw-bold">Especialidad:</label>
                    <input type="text" name="especialidad" class="form-control" placeholder="Ej. Cardiología" required>
                </div>
                <div class="col-md-2 d-flex align-items-end">
                    <button type="submit" class="btn btn-primary w-100">Generar Reporte</button>
                </div>
            </form>

        </div>
    </div>

    <div th:if="${reporte != null}" class="card shadow mt-4 border-primary">
        <div class="card-body text-center">
            <h4 class="text-primary mb-4">Resultado del Reporte</h4>

            <table class="table table-bordered w-75 mx-auto">
                <thead class="table-primary">
                <tr>
                    <th>Criterio Evaluado (Médico - Especialidad)</th>
                    <th>Total de Citas Registradas</th>
                </tr>
                </thead>
                <tbody>
                <tr>
                    <td class="fs-5" th:text="${reporte.criterio}"></td>
                    <td class="fs-4 fw-bold text-success" th:text="${reporte.totalCitas}"></td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

</body>
</html>
